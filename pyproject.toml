[project]
name = "omarchy-healer"
version = "0.1.0"
description = "Multi-agent system monitor and auto-remediator for Omarchy Linux using LangGraph, LangChain, NVIDIA NIM, and Gemini"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
omarchy-healer = "omarchy_healer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omarchy_healer"]
